<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morotti Gym - App</title>
    <style>
        /* Estilos Globais Modernos (Estilo Dark/Academia) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #09090b;
            color: #f4f4f5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 0;
        }

        @media (min-width: 640px) {
            body { padding: 20px; }
        }

        /* Container Principal estilo Celular */
        .app-container {
            width: 100%;
            max-width: 420px;
            background-color: #18181b;
            min-height: 100vh;
            border: 1px solid #27272a;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        @media (min-width: 640px) {
            .app-container {
                min-height: 800px;
                border-radius: 24px;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
                overflow: hidden;
            }
        }

        /* Topo / Header */
        header {
            padding: 24px;
            text-align: center;
            border-b: 1px solid #27272a;
            background-color: #18181b;
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1px solid #27272a;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            color: #dc2626;
        }

        header p {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #a1a1aa;
            margin-top: 4px;
        }

        /* Alternador de Nível de Acesso */
        .toggle-container {
            margin-top: 16px;
            display: inline-flex;
            padding: 4px;
            background-color: #09090b;
            border-radius: 8px;
            border: 1px solid #27272a;
        }

        .toggle-btn {
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-aluno-ativo {
            background-color: #dc2626;
            color: #ffffff;
        }

        .btn-func-ativo {
            background-color: #f59e0b;
            color: #09090b;
        }

        .btn-inativo {
            background-color: transparent;
            color: #a1a1aa;
        }

        .btn-inativo:hover {
            color: #f4f4f5;
        }

        /* Grid de Botões Principal */
        main {
            flex: 1;
            padding: 24px;
        }

        .menu-grid {
            display: grid;
            grid-template-cols: repeat(2, 1fr);
            gap: 16px;
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(39, 39, 42, 0.5);
            border: 1px solid #27272a;
            padding: 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            color: #f4f4f5;
            aspect-ratio: 1 / 1;
            text-align: center;
        }

        .menu-item:hover {
            background-color: #27272a;
            transform: translateY(-2px);
        }

        .menu-item .emoji {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .menu-item span {
            font-size: 0.875rem;
            font-weight: 500;
        }

        /* Botão específico do WhatsApp */
        .menu-item.whatsapp {
            background-color: rgba(6, 78, 59, 0.3);
            border-color: rgba(6, 95, 70, 0.5);
            color: #34d399;
        }

        .menu-item.whatsapp:hover {
            background-color: rgba(6, 78, 59, 0.6);
        }

        /* Painel Administrativo do Funcionário */
        .admin-section {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #27272a;
        }

        .hidden {
            display: none !important;
        }

        .admin-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #f59e0b;
            font-size: 0.75rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 16px;
        }

        .menu-item.admin {
            background-color: rgba(120, 53, 4, 0.2);
            border-color: rgba(146, 64, 14, 0.4);
            color: #fbbf24;
        }

        .menu-item.admin:hover {
            background-color: rgba(120, 53, 4, 0.4);
        }

        /* Rodapé */
        footer {
            padding: 16px;
            text-align: center;
            border-top: 1px solid #27272a;
            font-size: 0.65rem;
            color: #52525b;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Topo / Header -->
        <header>
            <h1>MOROTTI GYM</h1>
            <p>Força • Disciplina • Evolução</p>
            
            <div class="toggle-container">
                <button onclick="mudarAcesso('aluno')" id="btn-aluno" class="toggle-btn btn-aluno-ativo">
                    Aluno
                </button>
                <button onclick="mudarAcesso('funcionario')" id="btn-funcionario" class="toggle-btn btn-inativo">
                    Funcionário
                </button>
            </div>
        </header>

        <!-- Menu Principal -->
        <main>
            <div class="menu-grid">
                
                <div class="menu-item">
                    <div class="emoji">🏠</div>
                    <span>Início</span>
                </div>

                <div class="menu-item">
                    <div class="emoji">🏋🏻</div>
                    <span>Meu treino</span>
                </div>

                <div class="menu-item">
                    <div class="emoji">📅</div>
                    <span>Horários</span>
                </div>

                <div class="menu-item">
                    <div class="emoji">💳</div>
                    <span>Meu plano</span>
                </div>

                <div class="menu-item">
                    <div class="emoji">👤</div>
                    <span>Meu perfil</span>
                </div>

                <div class="menu-item">
                    <div class="emoji">📢</div>
                    <span>Avisos</span>
                </div>

                <div class="menu-item">
                    <div class="emoji">📍</div>
                    <span>Academia</span>
                </div>

                <a href="https://wa.me" target="_blank" class="menu-item whatsapp">
                    <div class="emoji">💬</div>
                    <span>WhatsApp</span>
                </a>

            </div>

            <!-- PAINEL EXCLUSIVO DO FUNCIONÁRIO -->
            <div id="area-funcionario" class="admin-section hidden">
                <div class="admin-title">
                    <span>⚠️ Painel Administrativo</span>
                </div>
                
                <div class="menu-grid">
                    <div class="menu-item admin">
                        <div class="emoji">👥</div>
                        <span>Cadastrar Aluno</span>
                    </div>

                    <div class="menu-item admin">
                        <div class="emoji">📝</div>
                        <span>Editar Treinos</span>
                    </div>
                </div>
            </div>

        </main>

        <!-- Rodapé -->
        <footer>
            Morotti Gym App &copy; 2026 • Todos os direitos reservados.
        </footer>
    </div>

    <!-- Script de Alternância de Abas -->
    <script>
        function mudarAcesso(tipo) {
            const areaFunc = document.getElementById('area-funcionario');
            const btnAluno = document.getElementById('btn-aluno');
            const btnFunc = document.getElementById('btn-funcionario');

            if (tipo === 'funcionario') {
                areaFunc.classList.remove('hidden');
                btnFunc.className = "toggle-btn btn-func-ativo";
                btnAluno.className = "toggle-btn btn-inativo";
            } else {
                areaFunc.classList.add('hidden');
                btnAluno.className = "toggle-btn btn-aluno-ativo";
                btnFunc.className = "toggle-btn btn-inativo";
            }
        }
    </script>
</body>
</html>
