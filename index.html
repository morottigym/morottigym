<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morotti Gym - App</title>
    <style>
        /* Estilos Globais Premium Dark Mode */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #09090b;
            color: #f4f4f5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 0;
        }

        @media (min-width: 640px) {
            body { padding: 20px; }
        }

        /* Smartphone Container */
        .app-container {
            width: 100%;
            max-width: 420px;
            background-color: #18181b;
            min-height: 100vh;
            border: 1px solid #27272a;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        @media (min-width: 640px) {
            .app-container {
                min-height: 820px;
                border-radius: 24px;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
                overflow: hidden;
            }
        }

        /* Header */
        header {
            padding: 24px;
            text-align: center;
            background-color: #18181b;
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1px solid #27272a;
        }

        /* Estilização da Logomarca */
        .app-logo {
            max-width: 80px;
            height: auto;
            margin-bottom: 10px;
            border-radius: 50%;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            color: #dc2626;
        }

        header p {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #a1a1aa;
            margin-top: 4px;
        }

        /* Toggle de Acesso */
        .toggle-container {
            margin-top: 16px;
            display: inline-flex;
            padding: 4px;
            background-color: #09090b;
            border-radius: 8px;
            border: 1px solid #27272a;
        }

        .toggle-btn {
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-aluno-ativo { background-color: #dc2626; color: #ffffff; }
        .btn-func-ativo { background-color: #f59e0b; color: #09090b; }
        .btn-inativo { background-color: transparent; color: #a1a1aa; }
        .btn-inativo:hover { color: #f4f4f5; }

        /* Componentes de Conteúdo */
        main {
            flex: 1;
            padding: 24px;
        }

        .menu-grid {
            display: grid;
            grid-template-cols: repeat(2, 1fr);
            gap: 16px;
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(39, 39, 42, 0.5);
            border: 1px solid #27272a;
            padding: 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            color: #f4f4f5;
            aspect-ratio: 1 / 1;
            text-align: center;
        }

        .menu-item:hover {
            background-color: #27272a;
            transform: translateY(-2px);
        }

        .menu-item .emoji { font-size: 2rem; margin-bottom: 8px; }
        .menu-item span { font-size: 0.875rem; font-weight: 500; }
        .menu-item.whatsapp { background-color: rgba(6, 78, 59, 0.3); border-color: rgba(6, 95, 70, 0.5); color: #34d399; }
        .menu-item.whatsapp:hover { background-color: rgba(6, 78, 59, 0.6); }

        /* Painel Administrativo */
        .admin-section { margin-top: 32px; padding-top: 24px; border-top: 1px solid #27272a; }
        .admin-title { color: #f59e0b; font-size: 0.75rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 16px; }
        .menu-item.admin { background-color: rgba(120, 53, 4, 0.2); border-color: rgba(146, 64, 14, 0.4); color: #fbbf24; }
        .menu-item.admin:hover { background-color: rgba(120, 53, 4, 0.4); }

        /* Cartões Internos e Estilização de Texto */
        .info-card, .treino-card, .plano-card {
            background: #27272a;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            border-left: 4px solid #dc2626;
        }

        .info-card.gold, .plano-card.destaque { border-left-color: #f59e0b; }
        .info-card h3, .treino-card h3, .plano-card h3 { font-size: 1rem; color: #ffffff; margin-bottom: 6px; }
        .info-card p, .treino-card p, .plano-card p { font-size: 0.85rem; color: #a1a1aa; line-height: 1.4; }
        
        .section-title { margin-bottom: 16px; font-size: 1.3rem; color: #dc2626; text-transform: uppercase; letter-spacing: 0.05em; }
        .text-destaque { font-size: 0.95rem; line-height: 1.5; color: #e4e4e7; margin-bottom: 20px; text-align: justify; }

        /* Tabelas e Formulários */
        .tabela-horarios {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: #27272a;
            border-radius: 8px;
            overflow: hidden;
        }

        .tabela-horarios th, .tabela-horarios td {
            padding: 12px;
            text-align: left;
            font-size: 0.85rem;
            border-bottom: 1px solid #3f3f46;
        }

        .tabela-horarios th { background: #3f3f46; color: white; font-weight: bold; }

        .form-grupo { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
        .form-grupo label { font-size: 0.85rem; color: #a1a1aa; font-weight: 500; }
        .form-grupo input, .form-grupo select {
            padding: 10px;
            background: #27272a;
            border: 1px solid #3f3f46;
            border-radius: 6px;
            color: white;
            font-size: 0.9rem;
        }

        /* Botões Globais */
        .btn-voltar, .btn-acao {
            background-color: #27272a;
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #3f3f46;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: background 0.2s;
        }
        .btn-voltar:hover { background-color: #3f3f46; }
        .btn-acao.sucesso { background-color: #dc2626; border-color: #ef4444; margin-top: 20px; }
        .btn-acao.sucesso:hover { background-color: #b91c1c; }

        .social-links { display: flex; gap: 12px; margin-top: 16px; }
        .social-btn { flex: 1; text-align: center; background: #27272a; color: #f4f4f5; padding: 8px; border-radius: 6px; font-size: 0.8rem; text-decoration: none; border: 1px solid #3f3f46; }
        
        .hidden { display: none !important; }
        footer { padding: 16px; text-align: center; border-top: 1px solid #27272a; font-size: 0.65rem; color: #52525b; line-height: 1.5; }
    </style>
</head>
